name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate native iOS project (Prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: pod install
        working-directory: ios

      - name: Build unsigned .app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace firstApp.xcworkspace \
            -scheme firstApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into unsigned .ipa
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/firstApp.app Payload/
          zip -r firstApp-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: firstApp-unsigned-ipa
          path: firstApp-unsigned.ipa
